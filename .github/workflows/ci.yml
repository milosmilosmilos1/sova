name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder-value
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage.enabled=false
      - run: npm run build

  integration:
    name: Baza i integracioni testovi (lokalni Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      # Google prijava je uključena u supabase/config.toml (env(...)); u CI-ju probne vrednosti
      GOOGLE_CLIENT_ID: test-google-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Lokalni Supabase (migracije i seed)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Env iz lokalnog Supabase-a i probne tajne
        run: |
          eval "$(supabase status -o env)"
          token_key="v1:$(openssl rand -base64 32)"
          cron_secret="$(openssl rand -hex 32)"
          imp_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$token_key"
          echo "::add-mask::$cron_secret"
          echo "::add-mask::$imp_secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "TOKEN_ENCRYPTION_KEY=$token_key"
            echo "CRON_SECRET=$cron_secret"
            echo "IMPERSONATION_SECRET=$imp_secret"
          } >> "$GITHUB_ENV"
      - run: npm run test:db
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright, lokalni Supabase, Inngest dev)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      GOOGLE_CLIENT_ID: test-google-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: test-google-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - name: Lokalni Supabase (migracije, seed, Mailpit za auth emailove)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Env iz lokalnog Supabase-a i probne tajne
        run: |
          eval "$(supabase status -o env)"
          token_key="v1:$(openssl rand -base64 32)"
          cron_secret="$(openssl rand -hex 32)"
          imp_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$token_key"
          echo "::add-mask::$cron_secret"
          echo "::add-mask::$imp_secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "SUPABASE_JWT_SECRET=$JWT_SECRET"
            echo "TOKEN_ENCRYPTION_KEY=$token_key"
            echo "CRON_SECRET=$cron_secret"
            echo "IMPERSONATION_SECRET=$imp_secret"
          } >> "$GITHUB_ENV"
      - name: Playwright Chromium
        run: npx playwright install --with-deps chromium
      # dev server (kao lokalno): produkcijski build bi tražio produkcijske tajne (Resend, Upstash)
      - name: Dev server i Inngest dev server (zakazivanje ide kroz Inngest)
        run: |
          nohup npm run dev > dev.log 2>&1 &
          nohup npx --yes inngest-cli@1.46.0 dev -u http://localhost:3001/api/inngest --no-discovery > inngest.log 2>&1 &
          curl -s -o /dev/null --retry 60 --retry-delay 2 --retry-connrefused http://localhost:3001/api/health
          curl -s -o /dev/null --retry 60 --retry-delay 2 --retry-connrefused http://localhost:8288/
          # prvo prevođenje ruta na hladnom serveru traje; testovi zatim imaju uobičajene granice
          for p in / /login /register /api/inngest; do curl -s -o /dev/null --max-time 240 "http://localhost:3001$p"; done
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rezultati
          path: |
            test-results/
            dev.log
            inngest.log
          retention-days: 7
